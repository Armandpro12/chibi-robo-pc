# Description of Chibi-Robo! for the generic tools in tools/.
# No game data here: only identifiers, checksums and paths.

[game]
name = "Chibi-Robo!"
slug = "chibi-robo"
platform = "gamecube"
default_version = "GGTP01"

# Recognized versions. The checksum covers the complete (uncompressed) .iso image.
[[versions]]
game_id = "GGTP01"
region = "PAL"
revision = 0
iso_sha1 = "f321aa7fb1ae5101ec60f1bbca8184898142135a"

[[versions]]
game_id = "GGTE01"
region = "NTSC-U"
revision = 0
iso_sha1 = "9052f186411b49845323eaaeb014755bcf96321b"

[extract]
# U8 archives to unpack after extracting the disc (paths relative to the extracted root).
u8_archives = ["files/qp.bin"]

[code]
# Main executable and REL modules (paths relative to the extracted root).
dol = "sys/main.dol"
rel_dir = "unpacked/qp.bin/rel"

[recomp]
# Virtual address of the first REL module for DolRecomp (--rel-base). The modules are laid out one after the other,
# aligned on 64 KiB (16 modules, under 1 MiB: the actual end is computed by tools/build.py).
# Choice: right after the 24 MiB of MEM1 (0x80000000-0x817FFFFF). This area overlaps neither the DOL
# (0x80003100-0x80667438 in PAL, BSS included), nor the game heap (OS arena, always below 0x81800000),
# nor the uncached mirror (0xC0000000-0xC17FFFFF), nor the hardware registers (0xCC000000),
# nor the locked cache (0xE0000000). The runtime enlarges its host RAM to cover this area;
# the memory size reported to the game stays 24 MiB. See notes/recomp.md.
rel_base = 0x81800000
# Optional symbol map (MAP format read by DolRecomp), relative to games/<game>/; {id} = version.
symbol_map = "symbols/{id}.map"

[symbols]
# Reference symbols (read by tools/symbols.py, applied by tools/ghidra/analyze.py):
# decomp-toolkit (dtk) configuration of cbr_decomp, US version only; transposed to the other versions.
# dtk_dir is relative to the repository root (external/ is cloned locally and ignored by Git).
dtk_dir = "external/cbr_decomp/decomp_dtk_main/config/GGTE01"
reference = "GGTE01"
map_dir = "symbols"
attribution = """
Function names from cbr_decomp (https://github.com/eavpsp/cbr_decomp),
folder decomp_dtk_main/config/GGTE01, licensed under CC0 1.0 (decomp_dtk_main/LICENSE).
This file only contains names and addresses, no game data.
This file is dedicated to the public domain under CC0 1.0 (see /LICENSES/CC0-1.0.txt)."""

[decomp]
# tools/decomp_progress.py: progress of the decompilation (stage 2), per version and per module.
# The set of functions comes from the reference version's dtk symbols ([symbols] dtk_dir: every function with
# its bounds, DOL and RELs); the other versions reach the same functions through the transposition report of
# tools/symbols.py (`transposition` below, generated/, not in Git) and, for the RELs, by running the same
# matcher on the two versions' REL files. A function without an address in a version never counts as
# decompiled in that version (parity rule).
reference = "GGTE01"
# Folder of the decompiled code (relative to games/<game>/), scanned for automatic names.
dir = "decomp"
# Table of the decompiled functions (relative to games/<game>/); missing = nothing decompiled yet. Also read by
# tools/decomp_functions.py and tools/build.py (HLE hook and registration of each enabled function at its address
# in the version being built).
functions = "decomp/functions.tsv"
# Statuses of the table (compared whole, case-insensitive, surrounding brackets ignored; never by prefix):
#   verified   = replaces its recompiled version and passed the oracle: the only status counted as decompiled
#   unverified = replaces its recompiled version, not yet checked by the oracle: shown as "replaced, not
#                verified", never in the percentages nor in --require-complete
#   disabled   = listed, not built: not counted, no warning
# Any other status is reported as a warning and not counted.
done_statuses = ["verified"]
replaced_statuses = ["unverified"]
listed_statuses = ["disabled"]
# Transposition report of tools/symbols.py, relative to the repository root ({slug}, {ref}, {id}).
transposition = "generated/{slug}/{id}/symbols/{ref}-to-{id}.tsv"
# Categories of the partition left out of the decompilation (replaced by native code instead).
excluded = ["init", "library"]
# REL functions left out (category "rel-excluded"): the Metrowerks runtime's global destructor chain, linked
# into 10 of the 16 modules, as global_destructor_chain.c is in the DOL's excluded library range. Verified: the
# disassembly of two modules registers and walks the chain of global destructors, and the copies of the other
# modules have the same code (relocations masked) in GGTE01 and GGTP01.
rel_excluded_names = ["__register_global_object", "__destroy_global_chain"]

# Column of the table holding each version's address (other accepted spellings: see the header of
# tools/decomp_progress.py). One [decomp] section only, and the columns always as this sub-table, never as an
# inline "columns = { ... }" key (TOML refuses a table declared twice).
[decomp.columns]
GGTE01 = "us_addr"
GGTP01 = "pal_addr"

# DOL partition (notes/decomp.md section D1.4), in reference-version addresses, [start, end); a function
# belongs to the range that holds its start address. Category "game" and "hsd" are decompiled.
# Method: names (dtk symbols, GGTE01.map, SDK signature catalog) plus address ranges (the linker keeps the
# library objects together) plus the source file names referenced by the code. The HSD bounds are a
# hypothesis (to be confirmed by the reverse agent); they only split "to decompile" in two.
[[decomp.ranges]]
category = "init"       # .init section: Metrowerks start-up, TRK and MSL helpers
start = 0x80003100
end = 0x80007880
[[decomp.ranges]]
category = "game"
start = 0x80007880
end = 0x8014AAFC
[[decomp.ranges]]
category = "library"    # TRK, Metrowerks runtime, MSL (math included), Nintendo SDK (MTX, ARC...)
start = 0x8014AAFC
end = 0x8018D43C
[[decomp.ranges]]
category = "game"
start = 0x8018D43C
end = 0x801AAABC
[[decomp.ranges]]
category = "hsd"        # sysdolphin (HSD) and the sound drivers linked with the game (hypothesis on the bounds)
start = 0x801AAABC
end = 0x801F2DA8
[[decomp.ranges]]
category = "game"       # no end: up to the last function
start = 0x801F2DA8

# Single functions outside their range's category (reference address; the name is checked when known).
[[decomp.overrides]]
addr = 0x8001580C
name = "OSReport"
category = "library"
[[decomp.overrides]]
addr = 0x801FD144
name = "THPInit"
category = "library"    # THP library: native replacement or decompilation still to decide (notes/decisions.md)

[run.watch]
# tools/run.py: code addresses whose hits at block entry the executable counts (GCRT_WATCH),
# to prove that the main loop runs (the internal boot notes, sections 7 and 8):
# return from VIWaitForRetrace in the main loop, then entry of VIWaitForRetrace.
GGTP01 = ["80015998", "80173EE0"]
GGTE01 = ["800156CC", "80171630"]

[run.force]
# tools/run.py --scenario: values forced on entry to game functions (GCRT_FORCE_ARG="ADDRESS:rN=VALUE;...",
# hexadecimal address, then the original function runs) so that runs can be compared pixel for pixel and
# bit for bit. Why: the game calls srand(OSGetTick()) at startup; a version that executes fewer
# instructions before that point (any native replacement of milestone 10) gets another seed, hence other random
# scenery on the title screen and in the menus (rings, character paths). Same seed for the reference and the
# candidate: strict A/B (notes/validation.md). Address of `srand` (MSL) specific to each version, same seed value.
# GGTE01: 0x80158A0C found by disassembling the US DOL (`stw r3,-0x7350(r13) ; blr`, 8 bytes): called only
# once, by the CGame startup code right after `bl OSGetTick` (8001D900 -> 8001D904), like the PAL (8001DCE4 ->
# 8001DCE8: call to `srand` 0x8015B2BC); the next function (`rand`) reads and writes the same SDA variable.
GGTP01 = ["8015B2BC:r3=0x12345678"]
GGTE01 = ["80158A0C:r3=0x12345678"]

[stage]
# tools/run.py --stage <name|number>: start in a chosen stage (tooling: reproduce a report, test a point of the
# game without a matching save). How: when the game restores a save, the stage stored in the save is replaced
# ONCE, just before the restore function reads it (GCRT_FORCE_ARG memory item, first entry only). The rest of the
# save (position, counters, battery, time, story flags) is restored by the game as usual, and later stage
# changes (the warps of the debug scene's menus, doors) are left alone. A save must be loaded: a user folder with
# a save (--user-seed / --user-dir) and a scenario (or a player) that loads it.
# Normal stages are numbered 0 to count - 1.
count = 30

[stage.start]
# GCRT_FORCE_ARG items added by tools/run.py, "{stage}" replaced by the stage number. Each acts once:
# - on entry to the save restore function (r3 = save data), the stage stored in the save (32-bit word at
#   save+0xC408), which the function copies to the current stage;
# - at the same point, the current stage of the game object, which the function first copies to the previous
#   stage: "previous = current" as on a normal load, as if the save had been made in the chosen stage;
# - right after the restore, the game sets the flag 0x2000 in a flags word of the game object (`ori 0x2000` after
#   the call); while it is set, the stage places Chibi-Robo at the spot where the save was made, which lies inside
#   the scenery of another stage. It is cleared on entry to the next function called there (the call made from
#   RETURN - 4 only: that function is also called from elsewhere before), so the stage uses its own starting point.
# GGTE01: restore 0x80087CC0 (called from 0x80012704), game object 0x8025C400 (current stage +0x3444, flags +0x1B14),
# next call at 0x80012734 to 0x8006656C; stage change 0x8000B394, called with 20000 by the save load at 0x80030C48;
# stage getter 0x80087A40.
# GGTP01: restore 0x80089C1C (called from 0x80012864), the same function (same instructions as the US one apart
# from the game object's address 0x80263000, its fields at +8 (current stage +0x344C, flags +0x1B1C) and
# constants; reads at the same save offsets); next call at 0x80012894 to 0x800682F0; stage change 0x8000B3B4 (60
# of its first 64 instructions match the US one, masked immediates), called by the save load at 0x8003158C; stage
# getter 0x8008999C (identical to the US one).
GGTP01 = ["80089C1C:[r3+0xC408]={stage}#1", "80089C1C:[0x8026644C]={stage}#1",
          "800682F0@80012898:[0x80264B1C]&=0xFFFFDFFF#1"]
GGTE01 = ["80087CC0:[r3+0xC408]={stage}#1", "80087CC0:[0x8025F844]={stage}#1",
          "8006656C@80012738:[0x8025DF14]&=0xFFFFDFFF#1"]

[stage.names]
# Stage numbers from unplug (https://github.com/adierking/unplug, MIT License, Copyright (c) 2022 Derpky); the
# short names are ours. Unnamed stages (8, 12, 15, 17, 19 to 21, 23 to 29) are chosen by number.
debug = 0
kitchen = 1
foyer = 2
basement = 3
jennys-room = 4
chibi-house = 5
bedroom = 6
living-room = 7
backyard = 9
staff-credit = 10
drain = 11
chibi-manual = 13
living-room-birthday = 14
ufo = 16
bedroom-past = 18
mother-spiders-room = 22

[pgo]
# tools/pgo.py train (local PGO profiles of our builds, build/pgo/, never in Git): scenarios replayed by the instrumented
# executable (tools/run.py --scenario, cycle clock, hence reproducible). They must go through the game's hot
# code: menus, title screen, 3D scene of the introduction (birthday party). Measurements: notes/performance.md.
scenarios = ["title-boot", "intro-no-card"]

[hle.hooks]
# Game-specific entry points to compile with an HLE hook (tools/build.py -> DolRecomp --hle-hooks),
# for the address-based replacements installed in games/chibi-robo/main.c (GcrtGameDesc.install,
# gcrt_hle_register). SDK functions do not need to be listed here: they are found by signature
# (runtime/core/hle/sdk_signatures.tsv). See notes/hle.md. Example: GGTP01 = [0x801ABBC0]

# tools/collect_diagnostics.cmd (tools/diag/): where the game's crash reports are and which process to inspect.
# user_org / user_app must match gcrt_set_user_identity() in main.c: the crash handler writes to
# %APPDATA%\<user_org>\<user_app>\crashes\ when the game is started normally. The collector writes its output to
# %LOCALAPPDATA%\<user_org>\<user_app>\diagnostics\ by default.
[diagnostics]
user_org = "Chibi Robo PC"
user_app = "Chibi Robo"
exe_name = "chibi-robo.exe"

[rea]
# tools/rea.py (optional): REA (Reverse Engineer Anything, https://github.com/morluto/rea, MIT License) on the
# main executable, converted to an ELF by tools/dol2elf.py (REA does not admit DOL files).
# Ghidra language passed as REA_GHIDRA_LANGUAGE_ID when an installed .ldefs declares it: the Gekko/Broadway
# language of the GameCubeLoader extension (Ghidra/Extensions/GameCubeLoader, installed by tools/bootstrap.py),
# which decodes the paired-single instructions. Without it REA uses PowerPC:BE:32:default.
language = "PowerPC:BE:32:Gekko_Broadway"
# Small-data bases (r13, r2) given to Ghidra through the ELF: "auto" scans them from the entry point and its
# first calls (found: GGTE01 r13 = 0x80661EC0, r2 = 0x80663D40; GGTP01 r13 = 0x80668D40, r2 = 0x8066ABE0),
# "none" leaves them unset, "0x...,0x..." gives r13,r2 by hand. See tools/dol2elf.py.
sda = "auto"

[installer]
# Version of the player installer (tools/installer/build.py): shown in the Programs list and in the installer's file
# properties, and part of its file name (chibi-robo-pc-setup-<version>.exe).
version = "0.1.1"
# Icon of the installer and of the uninstaller (the executable embeds the same file: chibi-robo.rc). Original
# pictogram drawn by tools/make_icon.py from icon.toml.
icon = "chibi-robo.ico"
