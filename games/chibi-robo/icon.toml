# Icon of the PC executable and of the installer: an ORIGINAL geometric pictogram (a generic boxy robot on a rounded
# tile), drawn by tools/make_icon.py from the shapes below. Nothing here comes from the game, its disc or any other
# artwork. Rebuild the .ico after a change:
#   py -3 tools/make_icon.py games/chibi-robo/icon.toml games/chibi-robo/chibi-robo.ico
# Coordinates are fractions of the icon size (0 = left/top, 1 = right/bottom). Shapes are drawn in order.

sizes = [16, 24, 32, 48, 64, 128, 256]

# Tile.
[[shape]]
kind = "rect"
box = [0.02, 0.02, 0.98, 0.98]
radius = 0.2
color = "#2B7A9B"

# Antenna: stem, then ball.
[[shape]]
kind = "rect"
box = [0.465, 0.17, 0.535, 0.36]
radius = 0.0
color = "#EEF2F4"

[[shape]]
kind = "circle"
center = [0.5, 0.16]
radius = 0.075
color = "#FFC23D"

# Ears.
